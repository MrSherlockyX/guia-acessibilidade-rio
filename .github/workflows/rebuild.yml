name: Atualizar Guia a partir do Markdown

on:
  push:
    paths:
      - 'GuiaAcessibilidade.md'
      - 'scripts/converter.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Conversor de Markdown
        run: |
          python scripts/converter.py "GuiaAcessibilidade.md"

      - name: Commit e Push das Atualizações
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add guiasite/index.html guiasite/js/app.js guiasite/assets/images/*
          if git diff --staged --quiet; then
            echo "Nenhuma alteração pendente para commitar."
          else
            git commit -m "chore(ci): atualizar portal a partir do GuiaAcessibilidade.md [skip ci]"
            git push origin main
          fi
